<section class="section-lg-t-space section-b-space">
    <div class="custom-container">
      <div class="auth-title">
        <h2>Login</h2>
      </div>
  
      <!-- Mensajes de error -->
      <div class="mt-3 text-center" *ngIf="errorMsg()">
        <small class="text-danger">{{ errorMsg() }}</small>
      </div>
  
      <!-- Botón Google -->
      <div class="text-center">
        <button 
          type="button"
          class="btn btn-outline" 
          (click)="loginWithGoogle()"
          [disabled]="loading()">
          <img class="img-fluid login-icon" src="./assets/images/icon/svg/google.svg" alt="google">
          <span *ngIf="!loading()">Continue with Google</span>
          <span *ngIf="loading()">Logging in…</span>
        </button>
      </div>
  
      <h5 class="content-color fw-medium mt-3 text-center">
        Don't have an account ?
        <a routerLink="/register" class="theme-color fw-semibold">Register</a>
      </h5>
    </div>
  </section>
